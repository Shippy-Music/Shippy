name: Bug or crash report
description: Report reproducible incorrect behavior in the latest Shippy alpha
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Shippy Alpha. Do not include credentials, private Crew invites, or copyrighted media.
  - type: input
    id: version
    attributes:
      label: Shippy version
      placeholder: Alpha Release 1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Tap...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or visual evidence
      description: Attach a redacted logcat, screenshot, or screen recording when possible.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for an existing report.
          required: true
        - label: I reproduced this on the latest Shippy alpha.
          required: true
        - label: I removed credentials and private data.
          required: true
