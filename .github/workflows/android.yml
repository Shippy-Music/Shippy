name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Install ninja-build
      run: sudo apt-get install -y ninja-build
    - name: Use the official FFmpeg GitHub mirror
      run: git config --global url.https://github.com/FFmpeg/FFmpeg.git.insteadOf https://git.ffmpeg.org/ffmpeg.git
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "jetbrains"
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Verify and build alpha APK
      run: ./gradlew spotlessCheck app:testDebugUnitTest musikr:testDebugUnitTest app:lintDebug app:assembleDebug
    - name: Verify Crew persistence and authentication contracts
      run: >-
        ./gradlew app:testDebugUnitTest
        --tests org.oxycblt.auxio.shippy.persistence.crew.CrewCheckpointPersistenceTest
        --tests org.oxycblt.auxio.shippy.persistence.library.CanonicalTrackMetadataMigrationTest
        --tests org.oxycblt.auxio.shippy.crew.auth.CrewJoinAuthenticatorTest
        --tests org.oxycblt.auxio.shippy.crew.invite.CrewInviteCodecTest
        --tests org.oxycblt.auxio.shippy.crew.rejoin.CrewRejoinLeaseTest
    - name: Assemble minified release APK
      run: ./gradlew app:assembleRelease
    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Shippy_Alpha
        path: ./app/build/outputs/apk/debug/app-debug.apk
    - name: Upload release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Shippy_Alpha_minified_unsigned
        path: ./app/build/outputs/apk/release/app-release-unsigned.apk

  instrumentation:
    runs-on: ubuntu-latest

    steps:
    - name: Install ninja-build
      run: sudo apt-get install -y ninja-build
    - name: Use the official FFmpeg GitHub mirror
      run: git config --global url.https://github.com/FFmpeg/FFmpeg.git.insteadOf https://git.ffmpeg.org/ffmpeg.git
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "jetbrains"
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Run service and temporary-storage instrumentation smoke tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        script: ./gradlew app:connectedDebugAndroidTest --no-daemon
